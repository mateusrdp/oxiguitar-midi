# Weekly version updates for the Rust crates and the workflows' actions, as
# pull requests into develop. scripts/check-dco.sh skips Dependabot's commits.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # OxiGuitar's crates are pinned by git tag on purpose (interface 1.4 is
      # frozen). Dependabot reads the tag against the crates' own versions and
      # proposes other tags, so every oxiguitar-* crate moves by hand.
      - dependency-name: "oxiguitar-*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

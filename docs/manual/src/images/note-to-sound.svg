<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" font-family="Helvetica, Arial, sans-serif" font-size="14"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><title>How the MIDI plugin turns a note into sound: the note becomes a MIDI message, the sound set finds the recording for it, and the audio goes to the output plugin</title><rect width="800" height="230" fill="#fff"/><text x="20" y="28" font-weight="bold" fill="#222">From a note on the tab to sound</text><rect x="20" y="60" width="170" height="80" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/><text x="105.0" y="87.0" text-anchor="middle" fill="#222" font-weight="bold">A note</text><text x="105.0" y="105.0" text-anchor="middle" fill="#222" font-size="12">6th string, 3rd fret</text><text x="105.0" y="123.0" text-anchor="middle" fill="#222" font-size="12">played medium-loud</text><rect x="225" y="60" width="170" height="80" rx="8" fill="#eef4fa" stroke="#1f6fb2" stroke-width="1.5"/><text x="310.0" y="87.0" text-anchor="middle" fill="#222" font-weight="bold">MIDI message</text><text x="310.0" y="105.0" text-anchor="middle" fill="#222" font-size="12">note on: G2 (key 43)</text><text x="310.0" y="123.0" text-anchor="middle" fill="#222" font-size="12">velocity 80, channel 1</text><rect x="430" y="60" width="170" height="80" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="515.0" y="87.0" text-anchor="middle" fill="#222" font-weight="bold">Sound set</text><text x="515.0" y="105.0" text-anchor="middle" fill="#222" font-size="12">finds the recording</text><text x="515.0" y="123.0" text-anchor="middle" fill="#222" font-size="12">nearest G2, at that loudness</text><rect x="635" y="60" width="145" height="80" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/><text x="707.5" y="87.0" text-anchor="middle" fill="#222" font-weight="bold">Audio</text><text x="707.5" y="105.0" text-anchor="middle" fill="#222" font-size="12">to the output</text><text x="707.5" y="123.0" text-anchor="middle" fill="#222" font-size="12">plugin</text><line x1="190" y1="100" x2="223" y2="100" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="395" y1="100" x2="428" y2="100" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="600" y1="100" x2="633" y2="100" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="20" y="180" fill="#555" font-size="13">A SoundFont, DLS or SFZ set is a library of short recordings of a real instrument, with rules for which recording to play for</text><text x="20" y="198" fill="#555" font-size="13">each note and loudness. Each guitar string gets its own MIDI channel, so a bend on one string doesn't bend the whole chord.</text></svg>